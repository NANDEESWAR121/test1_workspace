<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline | Scaloz Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Wix Madefor Display', 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    .background-gradient {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, rgba(94, 234, 212, 0.1) 0%, rgba(255, 255, 255, 0) 60%),
                  radial-gradient(circle at bottom left, rgba(45, 212, 191, 0.08) 0%, rgba(255, 255, 255, 0) 60%);
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }
    .card {
      position: relative;
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03), 0 1px 8px rgba(15, 23, 42, 0.02);
      z-index: 10;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: rgba(45, 212, 191, 0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px auto;
      border: 1px solid rgba(45, 212, 191, 0.15);
    }
    .icon {
      width: 38px;
      height: 38px;
      color: #14b8a6;
      stroke-width: 1.5;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      color: #0F172A;
    }
    p {
      font-size: 15px;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.25);
    }
    .btn:hover {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(20, 184, 166, 0.35);
    }
    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="background-gradient"></div>
  <div class="card">
    <div class="icon-container">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 11v4m0 4h.01" />
      </svg>
    </div>
    <h1>Connection Lost</h1>
    <p>We're having trouble connecting to Scaloz Portal. Please check your network connection and reload to retry.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
