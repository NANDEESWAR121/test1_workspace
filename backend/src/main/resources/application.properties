server.port=${SERVER_PORT:8082}
server.address=${SERVER_ADDRESS:0.0.0.0}

# AWS Secrets Manager
spring.cloud.aws.region.static=${AWS_REGION:ap-south-1}
spring.config.import=optional:aws-secretsmanager:scalozproduction/environment/database,optional:aws-secretsmanager:scalozproduction/environment/data

# PostgreSQL Connection settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:scaloz_super_admin}?sslmode=${SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Nanda123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooling Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Domain Configuration
scaloz.app.domainName=${DOMAIN_NAME:scaloz.com}
scaloz.app.workspacePrefix=${WORKSPACE_PREFIX:apps}

# JWT Config properties
scaloz.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
scaloz.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}
scaloz.app.jwtIssuer=${JWT_ISSUER:scaloz-iam}

# Encryption key — FIXED: code reads encryptionKey (not passwordXorKey)
scaloz.app.encryptionKey=${ENCRYPTION_KEY:scaloz_default_encryption_key_32bytes!}

# Multipart file upload limits (fixes 413 on icon upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.file-size-threshold=2KB

# Scaloz → HRMS reverse sync endpoint
scaloz.api.url=${SCALOZ_SYNC_URL:https://apps.scaloz.com/api/tenant-users/sync-from-hrms}

# Email (SMTP) configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:testadmin@xevyte.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:moyfxbwpghirmfpg}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
scaloz.security.trust-all-ssl=${SCALOZ_TRUST_ALL_SSL:false}